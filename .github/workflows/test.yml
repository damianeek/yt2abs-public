name: tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "unraid/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: unit tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

  extension:
    name: unit tests (firefox extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the suite
        run: node --test tests/*.test.js
