name: docker

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "unraid/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=yt2abs
            org.opencontainers.image.description=YouTube audio to Audiobookshelf podcast episodes
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  smoke:
    name: run the published image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run and probe
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ needs.build.outputs.digest }}"
          mkdir -p /tmp/smoke/data /tmp/smoke/tmp /tmp/smoke/library
          # The image runs as 99:100; the mounted directories must be writable.
          chmod -R 0777 /tmp/smoke
          cat > /tmp/smoke/config.yaml <<'YAML'
          defaults:
            retention_days: 7
          abs:
            url: http://127.0.0.1:9
            library_id: smoke
            library_path: /smoke/library
          paths:
            data_dir: /smoke/data
            tmp_dir: /smoke/tmp
            library_path: /smoke/library
          channels: {}
          YAML
          echo "starting $image"
          docker run -d --name yt2abs-smoke -p 127.0.0.1:8080:8080 \
            -v /tmp/smoke:/smoke \
            -e YT2ABS_CONFIG=/smoke/config.yaml \
            -e YT2ABS_WORKER_ENABLED=0 \
            -e YT2ABS_LOG_LEVEL=info \
            "$image"
          ready=no
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 1
          done
          echo "health after ${ready}:"
          cat /tmp/health.json 2>/dev/null || true
          [ "$ready" = yes ]
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/system > /tmp/system.json
          grep -q '"version"' /tmp/system.json
          curl -fsS -o /dev/null -w 'webui %{http_code}\n' http://127.0.0.1:8080/
          # The image also ships the example config for a standalone first run.
          docker exec yt2abs-smoke test -s /app/config.example.yaml

      - name: Container logs on failure
        if: failure()
        run: docker logs yt2abs-smoke || true
